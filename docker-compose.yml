services:
  ccs:
    build: .
    container_name: ccs_app
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:secret@db:5432/ccs_dev
      MEMCACHE_SERVERS: cache:11211
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_APP_CONFIG: /usr/local/bundle
      BUNDLE_BIN: /usr/local/bundle/bin
      GEM_HOME: /usr/local/bundle
      PATH: /usr/local/bundle/bin:${PATH}
    ports:
      - "3000:3000"
    volumes:
      - .:/app:cached
      - bundle:/usr/local/bundle
    command: >
      bash -lc "bundle check || bundle install && bundle exec rails server -b 0.0.0.0"

  db:
    image: postgres:9.6
    container_name: ccs_db
    environment:
      POSTGRES_DB: ccs_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: memcached:1.6
    container_name: ccs_cache
    command: memcached -m 64
    ports:
      - "11211:11211"

volumes:
  pgdata:
  bundle:
